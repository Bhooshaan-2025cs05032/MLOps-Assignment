name: MLOps CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # =========================================================
  # JOB 1: Build, Train, Test
  # =========================================================
  build-train-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

    - name: Run data preprocessing
      run: |
        python src/data_processing.py

    - name: Train model
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      run: |
        python src/train_model_and_log.py

    - name: Check model file
      run: |
        if [ ! -f "models/heart_disease_pred_model.pkl" ]; then
          echo "Model file not found!"
          exit 1
        fi

    - name: Smoke test prediction
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      run: |
        python - <<EOF
        from api.model_load_predict import predict

        sample = {
            "age": 63,
            "sex": 1,
            "cp": 3,
            "trestbps": 145,
            "chol": 233,
            "fbs": 1,
            "restecg": 0,
            "thalach": 150,
            "exang": 0,
            "oldpeak": 2.3,
            "slope": 0,
            "ca": 0,
            "thal": 1
        }

        result = predict(sample)
        print("Prediction result:", result)
        EOF


  # =========================================================
  # JOB 2: Docker Build + Run Test
  # =========================================================
  docker-build-run:
    needs: build-train-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t heart-disease-api .

    - name: Run Docker container
      run: |
        docker run -d -p 8000:8000 \
          -e MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
          -e MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }} \
          -e MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }} \
          --name heart-container heart-disease-api

    - name: Wait for container startup
      run: sleep 10

    - name: Test API endpoint
      run: |
        curl -X POST http://localhost:8000/predict \
        -H "Content-Type: application/json" \
        -d '{
          "age": 63,
          "sex": 1,
          "cp": 3,
          "trestbps": 145,
          "chol": 233,
          "fbs": 1,
          "restecg": 0,
          "thalach": 150,
          "exang": 0,
          "oldpeak": 2.3,
          "slope": 0,
          "ca": 0,
          "thal": 1
        }'

    - name: Show container logs (debug)
      if: always()
      run: docker logs heart-container