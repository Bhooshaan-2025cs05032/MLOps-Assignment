name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

env:
  REPO_LOWER: bhooshaan-2025cs05032/mlops-assignment

jobs:

  # =========================================================
  # JOB 1 - Train Model and Test
  # =========================================================
  train-model-and-test:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Setup Python
      # -----------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------
      # Install Dependencies
      # -----------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------
      # Run Tests
      # -----------------------------------------------------
      - name: Run tests with coverage
        run: |
          pytest tests/ \
          --cov \
          --cov-config=.coveragerc \
          --cov-report=term-missing \
          --cov-fail-under=80

      # -----------------------------------------------------
      # Data Preprocessing
      # -----------------------------------------------------
      - name: Run data preprocessing
        run: |
          python src/data_processing.py

      # -----------------------------------------------------
      # Train Model
      # -----------------------------------------------------
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/train_model_and_log.py

      # -----------------------------------------------------
      # Verify Model Exists
      # -----------------------------------------------------
      - name: Verify model artifact
        run: |
          if [ ! -f "models/heart_disease_pred_model.pkl" ]; then
            echo "Model artifact missing!"
            exit 1
          fi

      # -----------------------------------------------------
      # Smoke Test Prediction
      # -----------------------------------------------------
      - name: Smoke test prediction
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python - <<EOF
          from api.model_load_predict import predict

          sample = {
              "age": 63,
              "sex": 1,
              "cp": 3,
              "trestbps": 145,
              "chol": 233,
              "fbs": 1,
              "restecg": 0,
              "thalach": 150,
              "exang": 0,
              "oldpeak": 2.3,
              "slope": 0,
              "ca": 0,
              "thal": 1
          }

          result = predict(sample)
          print("Prediction:", result)
          EOF

  # =========================================================
  # JOB 2 - Docker Image Build and Push
  # =========================================================
  docker-image-build-and-push:
    runs-on: ubuntu-latest
    needs: train-model-and-test

    steps:

      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Generate Branch Tag
      # feature/mlops -> feature.mlops
      # -----------------------------------------------------
      - name: Generate branch tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '.' | tr '[:upper:]' '[:lower:]')
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # -----------------------------------------------------
      # Login to GHCR
      # -----------------------------------------------------
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # -----------------------------------------------------
      # Build Docker Image
      # -----------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
          -t ghcr.io/${{ env.REPO_LOWER }}:${{ env.BRANCH_NAME }} .

      # -----------------------------------------------------
      # Push Docker Image
      # -----------------------------------------------------
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ env.REPO_LOWER }}:${{ env.BRANCH_NAME }}

  # =========================================================
  # JOB 3 - Deploy to EC2 via K3s
  # =========================================================
  deploy-to-ec2-via-k3s:
    runs-on: ubuntu-latest
    needs: docker-image-build-and-push

    steps:

      # -----------------------------------------------------
      # Generate Branch Tag
      # -----------------------------------------------------
      - name: Generate branch tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '.' | tr '[:upper:]' '[:lower:]')
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # -----------------------------------------------------
      # Deploy to K3s via SSH
      # -----------------------------------------------------
      - name: Deploy to EC2 K3s Cluster
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            # -------------------------------------------------
            set -e

            export KUBECONFIG=/home/ubuntu/.kube/config
            
            echo "Deploying branch: ${{ env.BRANCH_NAME }}"

            # -------------------------------------------------
            # Create / Update Kubernetes Secret
            # -------------------------------------------------
            kubectl create secret generic mlflow-secret \
              --from-literal=MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
              --from-literal=MLFLOW_TRACKING_USERNAME="${{ secrets.MLFLOW_TRACKING_USERNAME }}" \
              --from-literal=MLFLOW_TRACKING_PASSWORD="${{ secrets.MLFLOW_TRACKING_PASSWORD }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            # -------------------------------------------------
            # Apply Kubernetes Manifests
            # -------------------------------------------------
            kubectl apply -f ~/k8s/deployment.yaml
            kubectl apply -f ~/k8s/service.yaml
            kubectl apply -f ~/k8s/ingress.yaml

            # -------------------------------------------------
            # Update Deployment Image Dynamically
            # -------------------------------------------------
            kubectl set image deployment/heart-api \
            heart-api=ghcr.io/${{ env.REPO_LOWER }}:${{ env.BRANCH_NAME }}

            # -------------------------------------------------
            # Restart Deployment
            # -------------------------------------------------
            kubectl rollout restart deployment heart-api

            # -------------------------------------------------
            # Wait for Successful Rollout
            # -------------------------------------------------
            kubectl rollout status deployment heart-api

            # -------------------------------------------------
            # Cleanup Unused Docker Images
            # -------------------------------------------------
            docker image prune -af || true

            echo "Kubernetes deployment complete!"